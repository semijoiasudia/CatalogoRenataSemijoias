<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Catálogo da Andressa</title>
    <meta property="og:type" content="website">
    <meta property="og:title" content="Catálogo da Andressa">
    <meta property="og:description" content="Confira o catálogo online da Andressa.">
    <meta property="og:url" content="https://renatasemijoias.com/andressa.html">
    <meta property="og:image" content="https://renatasemijoias.com/imagens/LogoAndressa.png">
    <meta property="og:image:secure_url" content="https://renatasemijoias.com/imagens/LogoAndressa.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="392">
    <meta property="og:image:height" content="190">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Catálogo da Andressa">
    <meta name="twitter:description" content="Confira o catálogo online da Andressa.">
    <meta name="twitter:image" content="https://renatasemijoias.com/imagens/LogoAndressa.png">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #333;
            background: #fff;
        }
    </style>
</head>
<body>
    <p>Carregando catálogo...</p>

    <script>
        /*
         * Esta página reutiliza o catálogo principal para receber todas as
         * atualizações de produtos. Apenas a logomarca é personalizada.
         * A largura e a resolução das fotos baixadas permanecem inalteradas.
         */
        (async () => {
            try {
                const resposta = await fetch('index.html', { cache: 'no-store' });

                if (!resposta.ok) {
                    throw new Error(`Não foi possível carregar o catálogo (${resposta.status}).`);
                }

                const catalogo = await resposta.text();
                const catalogoDaAndressa = catalogo
                    .replaceAll('imagens/logo.png', 'imagens/LogoAndressa.png')
                    .replace(
                        'fetch("rodape.txt")',
                        'fetch("rodape - Andressa.txt")'
                    )
                    .replace(
                        '<title>Renata - Semijoias e Acessórios</title>',
                        '<title>Catálogo da Andressa</title>'
                    );

                document.open();
                document.write(catalogoDaAndressa);
                document.close();
            } catch (erro) {
                document.body.innerHTML =
                    '<p>Não foi possível carregar o catálogo. Atualize a página e tente novamente.</p>';
                console.error(erro);
            }
        })();
    </script>
</body>
</html>
